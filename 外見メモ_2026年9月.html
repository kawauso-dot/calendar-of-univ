<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>外見メモ</title>
<style>
  @page { size: A4; margin: 18mm 16mm; }
  * { box-sizing: border-box; }
  body {
    font-family: "Yu Mincho", "游明朝", serif;
    color: #111111;
    line-height: 1.8;
    margin: 0;
    font-size: 11pt;
  }
  h1 {
    font-family: "Yu Mincho Demibold", "游明朝 Demibold", serif;
    font-size: 22pt;
    font-weight: bold;
    border-bottom: 3px solid #111111;
    padding-bottom: 8px;
    margin-bottom: 4px;
  }
  .subtitle {
    color: #555555;
    font-size: 10pt;
    margin-bottom: 24px;
  }
  h2 {
    font-family: "Yu Mincho Demibold", "游明朝 Demibold", serif;
    font-size: 14pt;
    font-weight: bold;
    margin-top: 30px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
  }
  .num-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #111111;
    color: #ffffff;
    font-size: 11pt;
    font-weight: bold;
    margin-right: 10px;
    flex-shrink: 0;
  }
  .card {
    background: #F9FAFB;
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 14px;
    color: #999999;
    font-size: 10pt;
    font-style: italic;
  }
</style>
</head>
<body>

<h1>外見メモ</h1>
<div class="subtitle">2026年9月　― 対話しながら随時更新 ―</div>

<h2><span class="num-badge">1</span>スキンケア</h2>
<div class="card">（今後追記）</div>

<h2><span class="num-badge">2</span>パーソナルカラー</h2>
<div class="card">（今後追記）</div>

<h2><span class="num-badge">3</span>服装</h2>
<div class="card">（今後追記）</div>

<h2><span class="num-badge">4</span>髪型</h2>
<div class="card">（今後追記）</div>

</body>
</html>
