<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BeInG">
<meta name="theme-color" content="#7c3aed">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", "Yu Gothic", "Meiryo", sans-serif;
    background: #f9f9f7;
  }
  body {
    display: flex; flex-direction: column;
    min-height: 100vh; min-height: 100dvh;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) body { background: #0d0d0d; }
  }
  :root[data-theme="dark"] body { background: #0d0d0d; }

  .app-nav {
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    padding: 44px 16px 0; max-width: 780px; margin: 0 auto; width: 100%;
    flex: 0 0 auto;
  }
  .app-nav button {
    font-size: 13px; font-weight: 600; color: #52514e;
    background: #fcfcfb; border: 1px solid rgba(11,11,11,0.10);
    border-radius: 8px; padding: 8px 16px; cursor: pointer;
  }
  .app-nav button.active { background: #0b0b0b; color: #fff; border-color: transparent; }
  @media (prefers-color-scheme: dark) {
    .app-nav button { background: #1a1a19; color: #c3c2b7; border-color: rgba(255,255,255,0.10); }
    .app-nav button.active { background: #fff; color: #141413; }
  }

  .app-view { display: none; flex: 1; min-height: 0; }
  .app-view.active { display: flex; flex-direction: column; }
  .app-view iframe {
    width: 100%; flex: 1; min-height: 0; border: 0; display: block;
  }

  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --accent:         #7c3aed;
    --accent-contrast:#ffffff;
    --surface-2:      #f2f0ea;
    --cell-off:       #e7e5de;
    --cell-on:        #7c3aed;
    max-width: 780px;
    flex: 1;
    min-height: 0;
    width: 100%;
    margin: 0 auto;
    padding: 16px 16px 48px;
    display: flex;
    flex-direction: column;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --border:         rgba(255,255,255,0.10);
      --accent:         #9d75f0;
      --accent-contrast:#141413;
      --surface-2:      #232321;
      --cell-off:       #2c2c2a;
      --cell-on:        #9d75f0;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --border:         rgba(255,255,255,0.10);
    --accent:         #9d75f0;
    --accent-contrast:#141413;
    --surface-2:      #232321;
    --cell-off:       #2c2c2a;
    --cell-on:        #9d75f0;
  }

  h1 {
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
    color: var(--text-primary);
    margin: 0 0 16px;
    letter-spacing: 0.02em;
    text-align: center;
  }

  .tiles-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tiles-group { width: 100%; }
  .tiles {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  @media (max-width: 520px) {
    .tiles { grid-template-columns: repeat(2, 1fr); }
  }
  .tile {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 12px;
    text-align: center;
    text-decoration: none;
    display: block;
    cursor: pointer;
  }
  .tile-label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 8px;
  }
  .tile-status {
    width: 10px; height: 10px;
    border-radius: 50%;
    margin: 0 auto 8px;
    background: var(--cell-off);
  }
  .tile-status.done { background: var(--accent); }
  .tile-streak {
    font-size: 11px;
    color: var(--text-secondary);
  }

  .backup-section {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .backup-btn {
    flex: 1 1 140px;
    font-size: 13px;
    color: var(--text-secondary);
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
  }
  .lock-screen {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    background: #f9f9f7; padding: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .lock-screen { background: #0d0d0d; }
  }
  :root[data-theme="dark"] .lock-screen { background: #0d0d0d; }
  .lock-card { width: 100%; max-width: 280px; text-align: center; }
  .lock-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: #0b0b0b; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .lock-title { color: #fff; }
  }
  :root[data-theme="dark"] .lock-title { color: #fff; }
  .lock-input {
    width: 100%; font-size: 16px; text-align: center; letter-spacing: 4px;
    padding: 12px; border-radius: 8px; border: 1px solid rgba(11,11,11,0.15);
    margin-bottom: 12px; box-sizing: border-box;
  }
  .lock-btn {
    width: 100%; font-size: 14px; font-weight: 600; color: #fff;
    background: #0b0b0b; border: none; border-radius: 8px; padding: 12px; cursor: pointer;
  }
  .lock-error { color: #d03b3b; font-size: 12.5px; margin-top: 10px; }

  .app-root { display: none; flex-direction: column; flex: 1; min-height: 0; width: 100%; }
  .app-root.unlocked { display: flex; }
</style>
</head><body>

<div id="lockScreen" class="lock-screen">
  <div class="lock-card">
    <div class="lock-title">BeInG</div>
    <input type="password" id="lockInput" class="lock-input" placeholder="PIN" inputmode="numeric" autocomplete="off">
    <button type="button" id="lockBtn" class="lock-btn">開く</button>
    <div id="lockError" class="lock-error" style="display:none;">PINが違います</div>
  </div>
</div>

<div id="appRoot" class="app-root">

<div class="app-nav" id="appNav">
  <button type="button" data-view="being" class="active">BeInG</button>
  <button type="button" data-view="training">Training</button>
  <button type="button" data-view="lifestyle">Lifestyle</button>
  <button type="button" data-view="appearance">Appearance</button>
  <button type="button" data-view="communication">Communication</button>
</div>

<div class="app-view active" id="view-being">
  <div class="viz-root">
    <div class="tiles-wrap">
      <div class="tiles-group">
        <h1>BeInG</h1>
        <div class="tiles">
          <a class="tile" href="#" data-goto="lifestyle">
            <div class="tile-label">Lifestyle</div>
            <div class="tile-status" id="lifestyle-status"></div>
            <div class="tile-streak" id="lifestyle-streak">-</div>
          </a>
          <a class="tile" href="#" data-goto="training">
            <div class="tile-label">Training</div>
            <div class="tile-status" id="training-status"></div>
            <div class="tile-streak" id="training-streak">-</div>
          </a>
          <a class="tile" href="#" data-goto="appearance">
            <div class="tile-label">Appearance</div>
          </a>
          <a class="tile" href="#" data-goto="communication">
            <div class="tile-label">Communication</div>
          </a>
        </div>
      </div>
    </div>

    <div class="backup-section">
      <button class="backup-btn" id="backupExportBtn" type="button">バックアップを保存</button>
      <button class="backup-btn" id="backupImportBtn" type="button">データを読み込む</button>
      <input type="file" id="backupImportFile" accept="application/json,.json" hidden>
    </div>
  </div>
</div>

<div class="app-view" id="view-training"><iframe id="frame-training" title="Training"></iframe></div>
<div class="app-view" id="view-lifestyle"><iframe id="frame-lifestyle" title="Lifestyle"></iframe></div>
<div class="app-view" id="view-appearance"><iframe id="frame-appearance" title="Appearance"></iframe></div>
<div class="app-view" id="view-communication"><iframe id="frame-communication" title="Communication"></iframe></div>

</div>

  const loaded = {};

  function decode(b64) {
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    return new TextDecoder("utf-8").decode(bytes);
  }

  function pad2(n) { return String(n).padStart(2, "0"); }
  function keyOf(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
  function readRecords(k) {
    try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : {}; }
    catch (e) { return {}; }
  }
  function computeStatus(records) {
    const today = new Date();
    const doneToday = !!records[keyOf(today)];
    let streak = 0;
    const cursor = new Date(today);
    if (!doneToday) cursor.setDate(cursor.getDate() - 1);
    while (records[keyOf(cursor)]) { streak += 1; cursor.setDate(cursor.getDate() - 1); }
    return { doneToday, streak };
  }
  function refreshBeingStatus() {
    [["lifestyle", "lifestyle_records_v1"], ["training", "kintore_records_v1"]].forEach(([prefix, key]) => {
      let records = readRecords(key);
      if (prefix === "lifestyle") {
        const withText = {};
        Object.keys(records).forEach(k => { if (records[k] && records[k].text) withText[k] = records[k]; });
        records = withText;
      }
      const { doneToday, streak } = computeStatus(records);
      document.getElementById(prefix + "-status").classList.toggle("done", doneToday);
      document.getElementById(prefix + "-streak").textContent = streak > 0 ? `🔥 ${streak}日` : "記録なし";
    });
  }

  function showView(name) {
    document.querySelectorAll(".app-view").forEach(el => el.classList.remove("active"));
    document.getElementById("view-" + name).classList.add("active");
    document.querySelectorAll("#appNav button").forEach(b => b.classList.toggle("active", b.dataset.view === name));
    if (name !== "being" && !loaded[name]) {
      document.getElementById("frame-" + name).srcdoc = decode(B64[name]);
      loaded[name] = true;
    }
    if (name === "being") refreshBeingStatus();
  }

  document.getElementById("appNav").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-view]");
    if (btn) showView(btn.dataset.view);
  });
  document.querySelectorAll("#view-being [data-goto]").forEach(el => {
    el.addEventListener("click", (e) => { e.preventDefault(); showView(el.dataset.goto); });
  });

  refreshBeingStatus();

  const BACKUP_KEYS = ["lifestyle_records_v1", "kintore_records_v1", "appearance_notes_v1"];
  const backupExportBtn = document.getElementById("backupExportBtn");
  const backupImportBtn = document.getElementById("backupImportBtn");
  const backupImportFile = document.getElementById("backupImportFile");

  backupExportBtn.addEventListener("click", () => {
    const data = {};
    BACKUP_KEYS.forEach(key => { data[key] = readRecords(key); });
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "being-backup.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  backupImportBtn.addEventListener("click", () => backupImportFile.click());
  backupImportFile.addEventListener("change", () => {
    const file = backupImportFile.files[0];
    backupImportFile.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        BACKUP_KEYS.forEach(key => {
          if (parsed[key]) {
            const merged = Object.assign({}, readRecords(key), parsed[key]);
            localStorage.setItem(key, JSON.stringify(merged));
          }
        });
        refreshBeingStatus();
        window.alert("読み込みました。");
      } catch (e) {
        window.alert("ファイルの形式が正しくありません。");
      }
    };
    reader.readAsText(file);
  });

  (function () {
    const UNLOCK_KEY = "being_unlocked_v1";
    const PIN = "135879";
    const lockScreen = document.getElementById("lockScreen");
    const appRoot = document.getElementById("appRoot");
    const lockInput = document.getElementById("lockInput");
    const lockError = document.getElementById("lockError");
    function unlock() {
      lockScreen.style.display = "none";
      appRoot.classList.add("unlocked");
    }
    if (localStorage.getItem(UNLOCK_KEY) === "1") {
      unlock();
      return;
    }
    function tryUnlock() {
      if (lockInput.value === PIN) {
        localStorage.setItem(UNLOCK_KEY, "1");
        unlock();
      } else {
        lockError.style.display = "block";
        lockInput.value = "";
      }
    }
    document.getElementById("lockBtn").addEventListener("click", tryUnlock);
    lockInput.addEventListener("keydown", (e) => { if (e.key === "Enter") tryUnlock(); });
  })();
</script>
