<title>Being</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", "Yu Gothic", "Meiryo", sans-serif;
    background: #f9f9f7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) body { background: #0d0d0d; }
  }
  :root[data-theme="dark"] body { background: #0d0d0d; }

  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --border-strong:  rgba(11,11,11,0.45);
    --danger:         #d03b3b;
    --accent:         #7c3aed;
    --accent-contrast:#ffffff;
    --surface-2:      #f2f0ea;
    --series-1:       #2a78d6; /* 胸・三頭 */
    --series-2:       #eb6834; /* 背中・二頭 */
    --series-3:       #1baf7a; /* 肩 */
    --series-4:       #eda100; /* 脚 */
    --series-5:       #898781; /* その他 */
    max-width: 860px;
    margin: 32px auto;
    padding: 0 16px 48px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --border-strong:  rgba(255,255,255,0.45);
      --danger:         #e66767;
      --accent:         #9d75f0;
      --accent-contrast:#141413;
      --surface-2:      #232321;
      --series-1:       #3987e5;
      --series-2:       #d95926;
      --series-3:       #199e70;
      --series-4:       #c98500;
      --series-5:       #898781;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --border-strong:  rgba(255,255,255,0.45);
    --danger:         #e66767;
    --accent:         #9d75f0;
    --accent-contrast:#141413;
    --surface-2:      #232321;
    --series-1:       #3987e5;
    --series-2:       #d95926;
    --series-3:       #199e70;
    --series-4:       #c98500;
    --series-5:       #898781;
  }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }
  h1 { font-size: 18px; font-weight: 600; color: var(--text-primary); margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--text-secondary); margin: 0 0 18px; }
  .status-note { font-size: 12px; color: var(--text-muted); margin: 0 0 14px; }

  .legend {
    display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary);
    margin-bottom: 16px; flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  .toolbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 14px; flex-wrap: wrap;
  }
  .month-nav { display: flex; align-items: center; gap: 10px; }
  .month-label { font-size: 14px; font-weight: 600; color: var(--text-primary); min-width: 92px; text-align: center; }
  .icon-btn {
    font-size: 14px; color: var(--text-secondary);
    background: transparent; border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; cursor: pointer;
  }
  .icon-btn:hover { border-color: var(--series-1); }
  .primary-btn {
    font-size: 13px; font-weight: 600; color: var(--accent-contrast);
    background: var(--accent); border: none;
    border-radius: 6px; padding: 8px 14px; cursor: pointer;
  }
  .primary-btn:hover { filter: brightness(1.08); }
  .primary-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .ghost-btn {
    font-size: 13px; color: var(--text-secondary);
    background: transparent; border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 14px; cursor: pointer;
  }
  .danger-btn {
    font-size: 12.5px; color: var(--danger);
    background: transparent; border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; cursor: pointer;
  }
  .danger-btn:hover { border-color: var(--danger); }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    margin-bottom: 20px;
  }
  .cal-head {
    text-align: center; font-size: 11px; color: var(--text-muted);
    padding: 4px 0 8px;
  }
  .cal-cell {
    position: relative;
    min-height: 56px;
    border: 1px solid var(--gridline);
    border-radius: 6px;
    background: transparent;
    font-family: inherit;
    padding: 6px;
    text-align: left;
    cursor: default;
    color: var(--text-secondary);
    font-size: 12px;
  }
  .cal-cell.empty { border-color: transparent; }
  .cal-cell.has-data { cursor: pointer; }
  .cal-cell.today { border-color: var(--text-muted); }
  .cal-cell.has-data:hover, .cal-cell.has-data:focus {
    border-color: var(--series-1);
    outline: none;
  }
  .cal-cell.selected {
    border-color: var(--text-primary);
    border-width: 2px;
  }
  .cal-daynum { font-weight: 600; color: var(--text-primary); }
  .cal-badge {
    margin-top: 4px;
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10.5px; color: var(--text-secondary);
  }
  .cal-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }

  .detail-title { font-size: 14px; font-weight: 600; color: var(--text-primary); margin: 4px 0 10px; }
  .detail-empty { font-size: 13px; color: var(--text-muted); padding: 12px 0; }
  .feedback-box {
    background: var(--surface-1);
    border: 1px solid var(--series-1);
    border-radius: 8px;
    padding: 12px 16px;
    margin: 4px 0 16px;
  }
  .feedback-label { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; }
  .feedback-text { font-size: 13px; color: var(--text-primary); white-space: pre-wrap; line-height: 1.6; }
  .feedback-text.empty { color: var(--text-muted); font-style: italic; }

  table.dataview {
    width: 100%; border-collapse: collapse; font-size: 12.5px; color: var(--text-primary);
  }
  table.dataview th, table.dataview td {
    text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--gridline);
  }
  table.dataview th { color: var(--text-muted); font-weight: 600; font-size: 11px; }
  table.dataview td.num, table.dataview th.num { font-variant-numeric: tabular-nums; text-align: right; }

  .detail-toprow {
    display: flex; justify-content: space-between; align-items: flex-start;
    flex-wrap: wrap; gap: 12px; margin-bottom: 8px;
  }
  .detail-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .chart-legend {
    display: flex; gap: 16px; font-size: 12.5px; color: var(--text-secondary);
    flex-wrap: wrap; margin-bottom: 10px;
  }
  .chart-legend-item { display: flex; align-items: center; gap: 6px; }
  .chart-legend-swatch { width: 12px; height: 4px; border-radius: 2px; display: inline-block; }
  svg#chart { display: block; overflow: visible; width: 100%; }
  .gridline { stroke: var(--gridline); stroke-width: 1; }
  .baseline-line { stroke: var(--baseline); stroke-width: 1; }
  .axis-label { fill: var(--text-muted); font-size: 11px; }
  .cat-label { fill: var(--text-secondary); font-size: 12px; }
  .cat-sub { fill: var(--text-muted); font-size: 10.5px; }
  .bar-label { fill: var(--text-secondary); font-size: 11px; font-weight: 600; text-anchor: middle; }
  .bar-mark:hover, .bar-mark:focus { filter: brightness(1.08); outline: none; }
  .hidden { display: none; }
  .tooltip {
    position: fixed; pointer-events: none;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font-size: 12.5px; color: var(--text-secondary);
    box-shadow: 0 4px 16px rgba(0,0,0,0.15); opacity: 0; transition: opacity 0.1s;
    z-index: 10; max-width: 220px;
  }
  .tooltip.visible { opacity: 1; }
  .tooltip .tt-title { color: var(--text-primary); font-weight: 600; margin-bottom: 4px; }
  .tooltip .tt-row { display: flex; align-items: center; gap: 6px; }
  .tooltip .tt-key { width: 10px; height: 2px; border-radius: 1px; display: inline-block; }
  .tooltip .tt-val { color: var(--text-primary); font-weight: 600; margin-left: auto; }

  /* form / modal */
  .modal-overlay {
    position: fixed; inset: 0; background: var(--surface-1);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 24px 16px; overflow-y: auto; z-index: 20;
  }
  .modal-card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 22px; width: 100%; max-width: 560px;
  }
  .modal-title { font-size: 15px; font-weight: 600; color: var(--text-primary); margin: 0 0 16px; }
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 11.5px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 6px;
  }
  .field input[type="date"], .field input[type="text"], .field input[type="number"],
  .field select, .field textarea {
    width: 100%; font: inherit; font-size: 13.5px; color: var(--text-primary);
    background: transparent; border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px;
  }
  .field textarea { resize: vertical; min-height: 60px; }
  .qty-input { border-color: var(--border-strong) !important; }
  .feedback-input-card {
    background: var(--surface-2); border: 1px solid var(--series-1); border-radius: 10px;
    padding: 14px; margin-bottom: 14px;
  }
  .feedback-input-card .field:last-child { margin-bottom: 0; }
  .exercise-row {
    display: grid; grid-template-columns: 1fr 90px 1fr auto; gap: 8px;
    align-items: end; margin-bottom: 8px;
  }
  @media (max-width: 480px) {
    .exercise-row { grid-template-columns: 1fr 1fr; }
    .exercise-row .field-remove { grid-column: span 2; text-align: right; }
  }
  .suggest-empty { font-size: 12.5px; color: var(--text-muted); margin: -6px 0 16px; }
  .field-mini label { font-size: 10.5px; }
  .row-remove-btn {
    font-size: 12px; color: var(--text-muted); background: transparent;
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; cursor: pointer;
  }
  .row-remove-btn:hover { color: var(--danger); border-color: var(--danger); }
  .modal-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .modal-actions-right { display: flex; gap: 8px; }
  .form-error { font-size: 12.5px; color: var(--danger); margin: -6px 0 12px; }

  .part-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
  @media (max-width: 480px) { .part-grid { grid-template-columns: 1fr; } }
  .part-btn {
    font-size: 14px; font-weight: 600; color: var(--text-primary);
    background: transparent; border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 10px;
  }
  .part-btn:hover { border-color: var(--series-1); }
  .part-btn .part-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  .wizard-progress { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .wizard-exercise-name { font-size: 17px; font-weight: 700; color: var(--text-primary); margin-bottom: 16px; }
  .sets-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

  .step-card {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; margin-bottom: 14px;
  }
  .step-card .field:last-child { margin-bottom: 0; }
  .step-card-label {
    font-size: 11.5px; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 10px;
  }
  .set-card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  @media (max-width: 480px) { .set-card-grid { grid-template-columns: 1fr; } }
  .tier-stack { display: flex; flex-direction: column; gap: 10px; }
  .set-card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 10px;
  }
  .set-card .set-card-title {
    font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px;
  }
  .set-card .field { margin-bottom: 8px; }
  .set-card .field:last-child { margin-bottom: 0; }

  .summary-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 6px; }
  .summary-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface-2); gap: 10px;
  }
  .summary-row-main { color: var(--text-primary); font-size: 13px; font-weight: 600; }
  .summary-row-sub { color: var(--text-secondary); font-size: 12px; margin-top: 2px; }
  .summary-edit-btn {
    font-size: 12px; color: var(--text-secondary); background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer;
    flex-shrink: 0;
  }
</style>

<div class="viz-root">
  <div class="card">
    <h1>筋トレ記録</h1>
    <p class="status-note" id="statusNote"></p>

    <div class="legend" id="legend"></div>

    <div class="toolbar">
      <div class="month-nav">
        <button class="icon-btn" id="prevMonthBtn" type="button" aria-label="前の月">←</button>
        <div class="month-label" id="monthLabel"></div>
        <button class="icon-btn" id="nextMonthBtn" type="button" aria-label="次の月">→</button>
      </div>
      <button class="primary-btn" id="addBtn" type="button">＋ 記録を追加</button>
      <button class="ghost-btn" id="exportBtn" type="button">バックアップを保存</button>
      <button class="ghost-btn" id="importBtn" type="button">データを読み込む</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>

    <div class="cal-grid" id="calGrid"></div>

    <div class="detail-toprow">
      <div id="detailTitle" class="detail-title"></div>
      <div class="detail-actions">
        <button class="ghost-btn" id="toggleBtn" type="button" style="display:none;">表で見る</button>
        <button class="ghost-btn" id="editBtn" type="button" style="display:none;">編集</button>
        <button class="danger-btn" id="deleteBtn" type="button" style="display:none;">削除</button>
      </div>
    </div>
    <div class="chart-legend" id="chartLegend"></div>
    <div id="chartWrap"><svg id="chart"></svg></div>
    <div id="tableWrap" class="hidden"></div>
    <div id="feedbackWrap"></div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>
<div id="modalRoot"></div>

<script>
const partColorVar = {
  "胸・三頭": "--series-1",
  "背中・二頭": "--series-2",
  "肩": "--series-3",
  "脚": "--series-4",
  "その他": "--series-5"
};
const partNames = Object.keys(partColorVar);

const fixedExercises = {
  "胸・三頭": ["ベンチプレス", "インクラインダンベルプレス", "ペックフライ", "オーバーエクステンション", "ケーブルプレスダウン"],
  "背中・二頭": ["ベントオーバーローイング", "懸垂", "ラットプルダウン", "スタンディングダンベルカール", "インクラインダンベルカール"],
  "肩": ["ショルダープレス", "サイドレイズ", "リアレイズ"]
};

/* セットごとに重量が変わる種目（3セットそれぞれ重量を入力する） */
const multiWeightExercises = ["ベンチプレス", "ベントオーバーローイング"];

function weightsToDisplay(weights) {
  const defined = (weights || []).filter(w => w !== null && w !== undefined && w !== "");
  if (defined.length === 0) return "";
  const allSame = defined.every(w => String(w) === String(defined[0]));
  if (allSame) return `${defined[0]}kg`;
  return (weights || []).map(w => (w === null || w === undefined || w === "" ? "—" : w)).join("/") + "kg";
}

/* 重量帯（各重量帯ごとに1〜3セット目まで入力する） */
const tierLabels = ["高重量", "中重量", "低重量"];

/* 種目ごとの重量選択肢の刻み幅。セットごとに重量が変わる種目は重量帯サフィックス付きの名前で登録する */
const weightStepConfig = {};
multiWeightExercises.forEach(name => {
  tierLabels.forEach(t => { weightStepConfig[`${name}（${t}）`] = { min: 0, max: 100, step: 10 }; });
});
Object.values(fixedExercises).flat().forEach(name => {
  if (multiWeightExercises.includes(name)) return;
  weightStepConfig[name] = { min: 0, max: 50, step: 1 };
});

function getLastWeightForExercise(exerciseName) {
  const dateKeys = Object.keys(records).sort();
  for (let i = dateKeys.length - 1; i >= 0; i--) {
    const rec = records[dateKeys[i]];
    if (!rec || !rec.entries) continue;
    const entry = rec.entries.find(e => e.exercise === exerciseName);
    if (!entry) continue;
    const w = parseFloat(String(entry.weight).replace(/kg$/i, ""));
    if (!isNaN(w)) return w;
  }
  return null;
}

function buildWeightOptions(cfg, referenceWeight) {
  const { min, max, step } = cfg;
  const all = [];
  for (let v = min; v <= max + 1e-6; v += step) all.push(Math.round(v * 100) / 100);
  if (referenceWeight === null || referenceWeight === undefined || isNaN(referenceWeight)) return all;
  let nearestIdx = 0, nearestDiff = Infinity;
  all.forEach((v, i) => {
    const diff = Math.abs(v - referenceWeight);
    if (diff < nearestDiff) { nearestDiff = diff; nearestIdx = i; }
  });
  const lo = Math.max(0, nearestIdx - 2);
  const hi = Math.min(all.length - 1, nearestIdx + 2);
  return all.slice(lo, hi + 1);
}

function createWeightSelect(exerciseName, existingValue) {
  const cfg = weightStepConfig[exerciseName];
  const sel = document.createElement("select");
  sel.className = "qty-input";
  const hasExisting = existingValue !== null && existingValue !== undefined && existingValue !== "" && !isNaN(existingValue);
  const referenceWeight = hasExisting ? Number(existingValue) : getLastWeightForExercise(exerciseName);
  const options = cfg ? buildWeightOptions(cfg, referenceWeight) : [];

  const emptyOpt = document.createElement("option");
  emptyOpt.value = "";
  emptyOpt.textContent = "ー";
  sel.appendChild(emptyOpt);

  const valStr = hasExisting ? String(existingValue) : "";
  if (valStr && !options.some(v => String(v) === valStr)) options.push(Number(valStr));
  options.sort((a, b) => a - b);
  options.forEach(v => {
    const opt = document.createElement("option");
    opt.value = String(v);
    opt.textContent = `${v} kg`;
    sel.appendChild(opt);
  });
  sel.value = valStr;
  return sel;
}

function createRepsSelect(existingValue) {
  const sel = document.createElement("select");
  sel.className = "qty-input";
  const emptyOpt = document.createElement("option");
  emptyOpt.value = "";
  emptyOpt.textContent = "ー";
  sel.appendChild(emptyOpt);
  for (let v = 0; v <= 10; v++) {
    const opt = document.createElement("option");
    opt.value = String(v);
    opt.textContent = `${v}`;
    sel.appendChild(opt);
  }
  const valStr = existingValue !== null && existingValue !== undefined && existingValue !== "" ? String(existingValue) : "";
  sel.value = valStr;
  return sel;
}

let db = null;
let unsubscribe = null;
let records = {};
let dbReady = false;

const today = new Date();
let activeYear = today.getFullYear();
let activeMonth = today.getMonth() + 1;
let selectedDate = null;

const statusNoteEl = document.getElementById("statusNote");
const legendEl = document.getElementById("legend");
const monthLabelEl = document.getElementById("monthLabel");
const prevMonthBtn = document.getElementById("prevMonthBtn");
const nextMonthBtn = document.getElementById("nextMonthBtn");
const addBtn = document.getElementById("addBtn");
const importBtn = document.getElementById("importBtn");
const importFile = document.getElementById("importFile");
const exportBtn = document.getElementById("exportBtn");
const calGridEl = document.getElementById("calGrid");
const detailTitleEl = document.getElementById("detailTitle");
const feedbackWrapEl = document.getElementById("feedbackWrap");
const chartLegendEl = document.getElementById("chartLegend");
const chartWrapEl = document.getElementById("chartWrap");

const toggleBtn = document.getElementById("toggleBtn");

function pad2(n) { return String(n).padStart(2, "0"); }
function dateKeyOf(y, m, d) { return `${y}-${pad2(m)}-${pad2(d)}`; }
function weekdayOf(y, m, d) {
  return ["日","月","火","水","木","金","土"][new Date(y, m - 1, d).getDay()];
}

/* このスマホのブラウザ内(localStorage)だけに保存するデータ層。
   claude.aiのアーティファクトDBには接続しないので、このHTMLを
   どこにホストしても記録の追加・編集・削除がそのまま使える。
   個人の記録データはソースコードに埋め込まない（公開リポジトリのため）。 */
const LOCAL_STORAGE_KEY = "kintore_records_v1";

function readLocalRecords() {
  try {
    const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
    if (raw === null) return {};
    return JSON.parse(raw);
  } catch (e) {
    return {};
  }
}
function writeLocalRecords(all) {
  localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(all));
}

function createLocalDb() {
  let listeners = [];
  function notify() {
    const all = readLocalRecords();
    const docs = Object.keys(all).map(id => ({ id, data: () => all[id] }));
    listeners.forEach(cb => cb({ docs }));
  }
  return {
    collection() {
      return {
        onSnapshot(cb) {
          listeners.push(cb);
          notify();
        }
      };
    },
    doc(path) {
      const id = path.split("/")[1];
      return {
        async set(data) {
          const all = readLocalRecords();
          all[id] = data;
          writeLocalRecords(all);
          notify();
        },
        async delete() {
          const all = readLocalRecords();
          delete all[id];
          writeLocalRecords(all);
          notify();
        }
      };
    }
  };
}

async function initDb() {
  db = createLocalDb();
  dbReady = true;
  statusNoteEl.textContent = "";
  unsubscribe = db.collection("workouts").onSnapshot(
    (snap) => {
      const next = {};
      snap.docs.forEach(d => { next[d.id] = d.data(); });
      records = next;
      renderCalendar();
    },
    (err) => {
      statusNoteEl.textContent = "記録の読み込みでエラーが発生しました。ページを開き直してください。";
    }
  );
}

  monthLabelEl.textContent = `${activeYear}年${activeMonth}月`;
}

prevMonthBtn.addEventListener("click", () => {
  activeMonth -= 1;
  if (activeMonth < 1) { activeMonth = 12; activeYear -= 1; }
  renderCalendar();
});
nextMonthBtn.addEventListener("click", () => {
  activeMonth += 1;
  if (activeMonth > 12) { activeMonth = 1; activeYear += 1; }
  renderCalendar();
});
addBtn.addEventListener("click", () => openForm(null));
exportBtn.addEventListener("click", () => {
  const data = readLocalRecords();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  /* ファイル名を固定にすることで、Googleドライブの同じフォルダに
     繰り返し保存したときに上書きされる（別ファイルが増えない）ようにする */
  a.download = "being-backup.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});
importBtn.addEventListener("click", () => importFile.click());
importFile.addEventListener("change", () => {
  const file = importFile.files[0];
  importFile.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const current = readLocalRecords();
      const merged = Object.assign({}, current, parsed);
      writeLocalRecords(merged);
      records = merged;
      renderCalendar();
      window.alert("読み込みました。");
    } catch (e) {
      window.alert("ファイルの形式が正しくありません。");
    }
  };
  reader.readAsText(file);
});

deleteBtn.addEventListener("click", async () => {
  if (!selectedDate || !db) return;
  if (!window.confirm(`${selectedDate} の記録を削除しますか？`)) return;
  deleteBtn.disabled = true;
  try {
    await db.doc("workouts/" + selectedDate).delete();
    selectedDate = null;
  } catch (e) {
    window.alert("削除に失敗しました。もう一度お試しください。");
  }
  deleteBtn.disabled = false;
});

function renderCalendar() {
  renderMonthLabel();
  calGridEl.innerHTML = "";
  const dayNames = ["日", "月", "火", "水", "木", "金", "土"];
  dayNames.forEach(dn => {
    const head = document.createElement("div");
    head.className = "cal-head";
    head.textContent = dn;
    calGridEl.appendChild(head);
  });

  const firstDay = new Date(activeYear, activeMonth - 1, 1);
  const daysInMonth = new Date(activeYear, activeMonth, 0).getDate();
  const startCol = firstDay.getDay();
  const isCurrentMonth = activeYear === today.getFullYear() && activeMonth === today.getMonth() + 1;

  for (let i = 0; i < startCol; i++) {
    const filler = document.createElement("div");
    filler.className = "cal-cell empty";
    calGridEl.appendChild(filler);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateKey = dateKeyOf(activeYear, activeMonth, d);
    const rec = records[dateKey];
    const cell = document.createElement("button");
    cell.type = "button";
    let cls = "cal-cell";
    if (rec) cls += " has-data";
    if (dateKey === selectedDate) cls += " selected";
    if (isCurrentMonth && d === today.getDate()) cls += " today";
    cell.className = cls;

    const numEl = document.createElement("div");
    numEl.className = "cal-daynum";
    numEl.textContent = d;
    cell.appendChild(numEl);

    if (rec) {
      const badge = document.createElement("div");
      badge.className = "cal-badge";
      const dot = document.createElement("span");
      dot.className = "cal-dot";
      dot.style.background = `var(${partColorVar[rec.part] || "--series-5"})`;
      badge.appendChild(dot);
      cell.appendChild(badge);

      cell.addEventListener("click", () => {
        selectedDate = dateKey;
        renderCalendar();
        renderDetail();
      });
    } else {
      cell.disabled = true;
    }

    calGridEl.appendChild(cell);
  }
  renderDetail();
}

function renderTable(rec) {
  const table = document.createElement("table");
  table.className = "dataview";
  const thead = document.createElement("thead");
  const headRow = document.createElement("tr");
  ["種目", "重量（kg）", "1セット目", "2セット目", "3セット目"].forEach((h, i) => {
    const th = document.createElement("th");
    if (i > 0) th.className = "num";
    th.textContent = h;
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  rec.entries.forEach(entry => {
    const tr = document.createElement("tr");
    const tdEx = document.createElement("td");
    tdEx.textContent = entry.exercise;
    tr.appendChild(tdEx);
    const tdW = document.createElement("td");
    tdW.className = "num";
    tdW.textContent = String(entry.weight).replace(/kg$/i, "");
    tr.appendChild(tdW);
    for (let i = 0; i < 3; i++) {
      const v = entry.sets[i];
      const td = document.createElement("td");
      td.className = "num";
      td.textContent = v === null || v === undefined ? "—" : `${v}`;
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tableWrapEl.appendChild(table);
}

function renderChart(rec) {
  const ns = "http://www.w3.org/2000/svg";
  function el(tag, attrs) {
    const e = document.createElementNS(ns, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  const entries = rec.entries;
  const width = Math.min(chartWrapEl.clientWidth || 800, 800);
  const height = 300;
  const marginTop = 24, marginBottom = 46, marginLeft = 32, marginRight = 12;
  const plotW = width - marginLeft - marginRight;
  const plotH = height - marginTop - marginBottom;

  chartSvg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  chartSvg.setAttribute("width", "100%");
  chartSvg.setAttribute("height", height);

  const allVals = entries.flatMap(e => e.sets.filter(v => v !== null && v !== undefined));
  const rawMax = Math.max(10, ...allVals);
  const maxVal = Math.ceil(rawMax / 2) * 2;
  const step = maxVal <= 12 ? 2 : Math.ceil(maxVal / 6 / 2) * 2;
  const yTicks = [];
  for (let t = 0; t <= maxVal; t += step) yTicks.push(t);

  yTicks.forEach(t => {
    const y = marginTop + plotH - (t / maxVal) * plotH;
    chartSvg.appendChild(el("line", {
      x1: marginLeft, x2: marginLeft + plotW, y1: y, y2: y,
      class: t === 0 ? "baseline-line" : "gridline"
    }));
    const label = el("text", { x: marginLeft - 8, y: y + 3, class: "axis-label", "text-anchor": "end" });
    label.textContent = t;
    chartSvg.appendChild(label);
  });

  const groupW = plotW / entries.length;
  const barGap = 2;

  entries.forEach((entry, gi) => {
    const groupX = marginLeft + gi * groupW;
    const groupCenter = groupX + groupW / 2;
    const barW = Math.min(24, (groupW - 16) / 3 - barGap);
    const totalBarsW = barW * 3 + barGap * 2;
    const startX = groupCenter - totalBarsW / 2;

    entry.sets.forEach((val, si) => {
      if (si > 2) return;
      const bx = startX + si * (barW + barGap);
      if (val === null || val === undefined) return;
      const barH = (val / maxVal) * plotH;
      const by = marginTop + plotH - barH;

      const rect = el("rect", {
        x: bx, y: by, width: barW, height: Math.max(barH, 1),
        rx: 4, ry: 4,
        fill: `var(${setSeriesVars[si]})`,
        class: "bar-mark",
        tabindex: "0",
        role: "img",
        "aria-label": `${entry.exercise} ${entry.weight} ${setSeriesNames[si]} ${val}レップ`
      });
      const mask = el("rect", { x: bx, y: by + Math.max(barH, 1) - 4, width: barW, height: 4, fill: `var(${setSeriesVars[si]})` });

      const showTip = (evt) => {
        tooltipEl.innerHTML = "";
        const title = document.createElement("div");
        title.className = "tt-title";
        title.textContent = `${entry.exercise} ${entry.weight}`;
        tooltipEl.appendChild(title);
        entry.sets.slice(0, 3).forEach((v2, si2) => {
          if (v2 === null || v2 === undefined) return;
          const row = document.createElement("div");
          row.className = "tt-row";
          const key = document.createElement("span");
          key.className = "tt-key";
          key.style.background = `var(${setSeriesVars[si2]})`;
          row.appendChild(key);
          const name = document.createElement("span");
          name.textContent = setSeriesNames[si2];
          row.appendChild(name);
          const val2 = document.createElement("span");
          val2.className = "tt-val";
          val2.textContent = `${v2}レップ`;
          row.appendChild(val2);
          tooltipEl.appendChild(row);
        });
        const clientX = evt.clientX !== undefined ? evt.clientX : 0;
        const clientY = evt.clientY !== undefined ? evt.clientY : 0;
        tooltipEl.style.left = `${clientX + 12}px`;
        tooltipEl.style.top = `${clientY - 12}px`;
        tooltipEl.classList.add("visible");
      };
      const hideTip = () => tooltipEl.classList.remove("visible");

      rect.addEventListener("pointermove", showTip);
      rect.addEventListener("pointerenter", showTip);
      rect.addEventListener("pointerleave", hideTip);
      rect.addEventListener("focus", showTip);
      rect.addEventListener("blur", hideTip);

      chartSvg.appendChild(rect);
      chartSvg.appendChild(mask);

      const label = el("text", { x: bx + barW / 2, y: by - 6, class: "bar-label" });
      label.textContent = val;
      chartSvg.appendChild(label);
    });

    const catLabel = el("text", { x: groupCenter, y: marginTop + plotH + 18, class: "cat-label", "text-anchor": "middle" });
    catLabel.textContent = entry.exercise.length > 8 ? entry.exercise.slice(0, 8) + "…" : entry.exercise;
    chartSvg.appendChild(catLabel);

    const subLabel = el("text", { x: groupCenter, y: marginTop + plotH + 32, class: "cat-sub", "text-anchor": "middle" });
    subLabel.textContent = entry.weight;
    chartSvg.appendChild(subLabel);
  });
}

/* ---------- 記録の追加・編集フォーム ---------- */

function parseSets(text) {
  return text.split(/[,、]/).map(s => s.trim()).filter(s => s !== "" || true)
    .map(s => (s === "" ? null : Number(s)))
    .filter((v, i, arr) => !(v === null && i === arr.length - 1 && arr.length > 1 && arr.slice(0, -1).every(x => x === null)))
    .slice(0, 3);
}

function setsToText(sets) {
  return (sets || []).map(v => (v === null || v === undefined ? "" : v)).join(", ");
}

function makeExerciseRow(rowsWrap, prefill) {
  const row = document.createElement("div");
  row.className = "exercise-row";

  const exField = document.createElement("div");
  exField.className = "field field-mini";
  exField.innerHTML = '<label>種目名</label>';
  const exInput = document.createElement("input");
  exInput.type = "text";
  exInput.placeholder = "例：スクワット";
  exInput.value = prefill ? prefill.exercise : "";
  exField.appendChild(exInput);
  row.appendChild(exField);

  const wField = document.createElement("div");
  wField.className = "field field-mini";
  wField.innerHTML = '<label>重量(kg)</label>';
  let wInput;
  const recognized = prefill && weightStepConfig[prefill.exercise];
  if (recognized) {
    const existW = parseFloat(String(prefill.weight).replace(/kg$/i, ""));
    wInput = createWeightSelect(prefill.exercise, isNaN(existW) ? "" : existW);
  } else {
    wInput = document.createElement("input");
    wInput.type = "number";
    wInput.min = "0";
    wInput.step = "0.5";
    wInput.className = "qty-input";
    wInput.value = prefill ? String(prefill.weight).replace(/kg$/i, "") : "";
  }
  wField.appendChild(wInput);
  row.appendChild(wField);

  const sField = document.createElement("div");
  sField.className = "field field-mini";
  sField.innerHTML = '<label>各セットの回数</label>';
  let sInput = null;
  let repsSelects = null;
  if (recognized) {
    const repsWrap = document.createElement("div");
    repsWrap.style.display = "flex";
    repsWrap.style.gap = "4px";
    repsSelects = [0, 1, 2].map(i => {
      const existS = prefill && prefill.sets && prefill.sets[i] !== null && prefill.sets[i] !== undefined ? prefill.sets[i] : "";
      const sel = createRepsSelect(existS);
      repsWrap.appendChild(sel);
      return sel;
    });
    sField.appendChild(repsWrap);
    wInput.addEventListener("change", () => {
      if (wInput.value === "") repsSelects.forEach(sel => { sel.value = ""; });
    });
  } else {
    sInput = document.createElement("input");
    sInput.type = "text";
    sInput.placeholder = "例：10, 8, 7";
    sInput.className = "qty-input";
    sInput.value = prefill ? setsToText(prefill.sets) : "";
    sField.appendChild(sInput);
  }
  row.appendChild(sField);

  const removeWrap = document.createElement("div");
  removeWrap.className = "field-remove";
  const removeBtn = document.createElement("button");
  removeBtn.type = "button";
  removeBtn.className = "row-remove-btn";
  removeBtn.textContent = "削除";
  removeBtn.addEventListener("click", () => row.remove());
  removeWrap.appendChild(removeBtn);
  row.appendChild(removeWrap);

  row._get = () => ({
    exercise: exInput.value.trim(),
    weight: wInput.value.trim(),
    sets: repsSelects ? repsSelects.map(sel => (sel.value.trim() === "" ? null : Number(sel.value))) : parseSets(sInput.value)
  });

  rowsWrap.appendChild(row);
  return row;
}

function openForm(dateKey) {
  const existing = dateKey ? records[dateKey] : null;
  vizRootEl.style.display = "none";

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeForm(); });

  const card = document.createElement("div");
  card.className = "modal-card";
  overlay.appendChild(card);
  modalRoot.appendChild(overlay);

  if (existing) {
    renderEditCard(card, dateKey, existing);
  } else {
    const initialDate = selectedDate && !records[selectedDate] ? selectedDate : dateKeyOf(today.getFullYear(), today.getMonth() + 1, today.getDate());
    renderWizard(card, initialDate);
  }
}

function closeForm() {
  modalRoot.innerHTML = "";
  vizRootEl.style.display = "";
}

function renderWizard(card, initialDate) {
  const state = {
    step: "part",
    date: initialDate,
    part: null,
    queue: [],
    index: 0,
    entries: []
  };

  render();

  function render() {
    card.innerHTML = "";
    if (state.step === "part") renderPartStep();
    else if (state.step === "exercise") renderExerciseStep();
    else if (state.step === "manual") renderManualStep();
    else renderSummaryStep();
  }

  function renderPartStep() {
    const title = document.createElement("div");
    title.className = "modal-title";
    title.textContent = "今日の部位は？";
    card.appendChild(title);

    const grid = document.createElement("div");
    grid.className = "part-grid";
    partNames.forEach(part => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "part-btn";
      const dot = document.createElement("span");
      dot.className = "part-dot";
      dot.style.background = `var(${partColorVar[part]})`;
      btn.appendChild(dot);
      const label = document.createElement("span");
      label.textContent = part;
      btn.appendChild(label);
      btn.addEventListener("click", () => {
        state.part = part;
        state.entries = [];
        if (fixedExercises[part]) {
          state.queue = fixedExercises[part].slice();
          state.index = 0;
          state.step = "exercise";
        } else {
          state.step = "manual";
        }
        render();
      });
      grid.appendChild(btn);
    });
    card.appendChild(grid);

    const actions = document.createElement("div");
    actions.className = "modal-actions";
    const cancelBtn = document.createElement("button");
    cancelBtn.type = "button";
    cancelBtn.className = "ghost-btn";
    cancelBtn.textContent = "キャンセル";
    cancelBtn.addEventListener("click", closeForm);
    actions.appendChild(cancelBtn);
    card.appendChild(actions);
  }

  function renderExerciseStep() {
    const exName = state.queue[state.index];
    const existingEntry = state.entries.find(e => e.exercise === exName);
    const isMultiWeight = multiWeightExercises.includes(exName);

    const title = document.createElement("div");
    title.className = "modal-title";
    title.textContent = state.part;
    card.appendChild(title);

    const progress = document.createElement("div");
    progress.className = "wizard-progress";
    progress.textContent = `${state.index + 1} / ${state.queue.length} 種目`;
    card.appendChild(progress);

    const exTitle = document.createElement("div");
    exTitle.className = "wizard-exercise-name";
    exTitle.textContent = exName;
    card.appendChild(exTitle);

    let wInput = null;
    let setInputs;
    let weightInputs;
    let setInputsByTier;

    if (isMultiWeight) {
      const stepCard = document.createElement("div");
      stepCard.className = "step-card";
      const stepCardLabel = document.createElement("div");
      stepCardLabel.className = "step-card-label";
      stepCardLabel.textContent = "重量帯ごとに重量と1〜3セット目の回数を入力";
      stepCard.appendChild(stepCardLabel);

      const tierStack = document.createElement("div");
      tierStack.className = "tier-stack";
      weightInputs = [];
      setInputsByTier = [];

      tierLabels.forEach((tierLabel, t) => {
        const suffixedName = `${exName}（${tierLabel}）`;
        const tierCard = document.createElement("div");
        tierCard.className = "set-card";
        const tierTitle = document.createElement("div");
        tierTitle.className = "set-card-title";
        tierTitle.textContent = tierLabel;
        tierCard.appendChild(tierTitle);

        const wField = document.createElement("div");
        wField.className = "field field-mini";
        wField.innerHTML = "<label>重量(kg)</label>";
        const existW = existingEntry && existingEntry.weights && existingEntry.weights[t] !== null && existingEntry.weights[t] !== undefined ? existingEntry.weights[t] : "";
        const wInp = createWeightSelect(suffixedName, existW);
        wField.appendChild(wInp);
        tierCard.appendChild(wField);
        weightInputs.push(wInp);

        const repsGrid = document.createElement("div");
        repsGrid.className = "set-card-grid";
        const tierSetInputs = [];
        [0, 1, 2].forEach(si => {
          const rField = document.createElement("div");
          rField.className = "field field-mini";
          rField.innerHTML = `<label>${si + 1}セット目</label>`;
          const existS = existingEntry && existingEntry.setsByTier && existingEntry.setsByTier[t] && existingEntry.setsByTier[t][si] !== null && existingEntry.setsByTier[t][si] !== undefined ? existingEntry.setsByTier[t][si] : "";
          const rInp = createRepsSelect(existS);
          rField.appendChild(rInp);
          repsGrid.appendChild(rField);
          tierSetInputs.push(rInp);
        });
        tierCard.appendChild(repsGrid);
        setInputsByTier.push(tierSetInputs);

        wInp.addEventListener("change", () => {
          if (wInp.value === "") tierSetInputs.forEach(sel => { sel.value = ""; });
        });

        tierStack.appendChild(tierCard);
      });

      stepCard.appendChild(tierStack);
      card.appendChild(stepCard);
    } else {
      const weightCard = document.createElement("div");
      weightCard.className = "step-card";
      const wField = document.createElement("div");
      wField.className = "field";
      wField.innerHTML = '<label>重量(kg)</label>';
      const existW = existingEntry ? parseFloat(String(existingEntry.weight).replace(/kg$/i, "")) : "";
      if (weightStepConfig[exName]) {
        wInput = createWeightSelect(exName, isNaN(existW) ? "" : existW);
        wInput.addEventListener("change", () => {
          if (wInput.value === "") setInputs.forEach(sel => { sel.value = ""; });
        });
      } else {
        wInput = document.createElement("input");
        wInput.type = "number";
        wInput.min = "0";
        wInput.step = "0.5";
        wInput.className = "qty-input";
        wInput.value = isNaN(existW) ? "" : existW;
      }
      wField.appendChild(wInput);
      weightCard.appendChild(wField);
      card.appendChild(weightCard);

      const setsCard = document.createElement("div");
      setsCard.className = "step-card";
      const setsCardLabel = document.createElement("div");
      setsCardLabel.className = "step-card-label";
      setsCardLabel.textContent = "各セットの回数";
      setsCard.appendChild(setsCardLabel);
      const grid = document.createElement("div");
      grid.className = "set-card-grid";
      setInputs = [0, 1, 2].map(i => {
        const setCard = document.createElement("div");
        setCard.className = "set-card";
        const setTitle = document.createElement("div");
        setTitle.className = "set-card-title";
        setTitle.textContent = `${i + 1}セット目`;
        setCard.appendChild(setTitle);
        const sField = document.createElement("div");
        sField.className = "field field-mini";
        sField.innerHTML = "<label>回数</label>";
        const existVal = existingEntry && existingEntry.sets[i] !== null && existingEntry.sets[i] !== undefined ? existingEntry.sets[i] : "";
        const inp = createRepsSelect(existVal);
        sField.appendChild(inp);
        setCard.appendChild(sField);
        grid.appendChild(setCard);
        return inp;
      });
      setsCard.appendChild(grid);
      card.appendChild(setsCard);
    }

    const actions = document.createElement("div");
    actions.className = "modal-actions";

    const backBtn = document.createElement("button");
    backBtn.type = "button";
    backBtn.className = "ghost-btn";
    backBtn.textContent = "戻る";
    backBtn.addEventListener("click", () => {
      if (state.index === 0) {
        state.step = "part";
      } else {
        state.index -= 1;
      }
      render();
    });
    actions.appendChild(backBtn);

    const rightActions = document.createElement("div");
    rightActions.className = "modal-actions-right";

    const skipBtn = document.createElement("button");
    skipBtn.type = "button";
    skipBtn.className = "ghost-btn";
    skipBtn.textContent = "スキップ";
    skipBtn.addEventListener("click", () => {
      state.entries = state.entries.filter(e => e.exercise !== exName);
      advance();
    });
    rightActions.appendChild(skipBtn);

    const nextBtn = document.createElement("button");
    nextBtn.type = "button";
    nextBtn.className = "primary-btn";
    nextBtn.textContent = state.index === state.queue.length - 1 ? "確認画面へ" : "次の種目へ";
    nextBtn.addEventListener("click", () => {
      if (isMultiWeight) {
        const weights = weightInputs.map(inp => (inp.value.trim() === "" ? null : Number(inp.value)));
        const setsByTier = setInputsByTier.map(arr => arr.map(inp => (inp.value.trim() === "" ? null : Number(inp.value))));
        const allEmpty = weights.every(v => v === null) && setsByTier.every(arr => arr.every(v => v === null));
        if (allEmpty) {
          state.entries = state.entries.filter(e => e.exercise !== exName);
          advance();
          return;
        }
        const entry = { exercise: exName, isMultiWeight: true, weight: weightsToDisplay(weights), weights, setsByTier };
        const idx = state.entries.findIndex(e => e.exercise === exName);
        if (idx >= 0) state.entries[idx] = entry; else state.entries.push(entry);
      } else {
        const sets = setInputs.map(inp => (inp.value.trim() === "" ? null : Number(inp.value)));
        const weight = wInput.value.trim();
        if (!weight && sets.every(v => v === null)) {
          state.entries = state.entries.filter(e => e.exercise !== exName);
          advance();
          return;
        }
        const entry = { exercise: exName, weight: weight ? `${weight}kg` : "", sets };
        const idx = state.entries.findIndex(e => e.exercise === exName);
        if (idx >= 0) state.entries[idx] = entry; else state.entries.push(entry);
      }
      advance();
    });
    rightActions.appendChild(nextBtn);

    actions.appendChild(rightActions);
    card.appendChild(actions);

    function advance() {
      if (state.index < state.queue.length - 1) {
        state.index += 1;
      } else {
        state.step = "summary";
      }
      render();
    }
  }

  function renderManualStep() {
    const title = document.createElement("div");
    title.className = "modal-title";
    title.textContent = state.part;
    card.appendChild(title);

    const label = document.createElement("div");
    label.className = "field";
    label.innerHTML = '<label>種目（種目名・重量・各セットの回数を入力）</label>';
    card.appendChild(label);

    const rowsCard = document.createElement("div");
    rowsCard.className = "step-card";
    card.appendChild(rowsCard);

    const rowsWrap = document.createElement("div");
    rowsCard.appendChild(rowsWrap);

    const existingForPart = state.entries.length ? state.entries : null;
    if (existingForPart) {
      existingForPart.forEach(en => makeExerciseRow(rowsWrap, en));
    } else {
      makeExerciseRow(rowsWrap, null);
    }

    const addRowBtn = document.createElement("button");
    addRowBtn.type = "button";
    addRowBtn.className = "ghost-btn";
    addRowBtn.textContent = "＋ 種目を追加";
    rowsCard.appendChild(addRowBtn);

    const errorEl = document.createElement("div");
    errorEl.className = "form-error hidden";
    card.appendChild(errorEl);

    const actions = document.createElement("div");
    actions.className = "modal-actions";
    const backBtn = document.createElement("button");
    backBtn.type = "button";
    backBtn.className = "ghost-btn";
    backBtn.textContent = "戻る";
    backBtn.addEventListener("click", () => { state.step = "part"; render(); });
    actions.appendChild(backBtn);

    const nextBtn = document.createElement("button");
    nextBtn.type = "button";
    nextBtn.className = "primary-btn";
    nextBtn.textContent = "確認画面へ";
    nextBtn.addEventListener("click", () => {
      const rows = Array.from(rowsWrap.children).map(r => r._get());
      const validRows = rows.filter(r => r.exercise !== "");
      if (validRows.length === 0) {
        errorEl.textContent = "種目を1つ以上入力してください。";
        errorEl.classList.remove("hidden");
        return;
      }
      state.entries = validRows.map(r => ({
        exercise: r.exercise,
        weight: r.weight ? `${r.weight}kg` : "",
        sets: [r.sets[0] ?? null, r.sets[1] ?? null, r.sets[2] ?? null]
      }));
      state.step = "summary";
      render();
    });
    actions.appendChild(nextBtn);
    card.appendChild(actions);
  }

  function renderSummaryStep() {
    const title = document.createElement("div");
    title.className = "modal-title";
    title.textContent = "記録を確認";
    card.appendChild(title);

    const errorEl = document.createElement("div");
    errorEl.className = "form-error hidden";
    card.appendChild(errorEl);

    const dateCard = document.createElement("div");
    dateCard.className = "step-card";
    card.appendChild(dateCard);

    const dateField = document.createElement("div");
    dateField.className = "field";
    dateField.innerHTML = '<label for="fDate">日付</label>';
    const dateInput = document.createElement("input");
    dateInput.type = "date";
    dateInput.id = "fDate";
    dateInput.value = state.date;
    dateField.appendChild(dateInput);
    dateCard.appendChild(dateField);

    const partLabel = document.createElement("div");
    partLabel.className = "field";
    partLabel.innerHTML = '<label>部位</label>';
    const partVal = document.createElement("div");
    partVal.style.fontSize = "13.5px";
    partVal.style.color = "var(--text-primary)";
    partVal.style.padding = "8px 0";
    partVal.textContent = state.part;
    partLabel.appendChild(partVal);
    dateCard.appendChild(partLabel);

    const summaryLabel = document.createElement("div");
    summaryLabel.className = "field";
    summaryLabel.innerHTML = '<label>記録した種目</label>';
    card.appendChild(summaryLabel);

    const summaryList = document.createElement("div");
    summaryList.className = "summary-list";
    if (state.entries.length === 0) {
      const empty = document.createElement("div");
      empty.className = "suggest-empty";
      empty.textContent = "記録した種目がありません。戻って入力してください。";
      summaryList.appendChild(empty);
    }
    state.entries.forEach(entry => {
      const row = document.createElement("div");
      row.className = "summary-row";
      const left = document.createElement("div");
      const main = document.createElement("div");
      main.className = "summary-row-main";
      main.textContent = entry.exercise;
      left.appendChild(main);
      const sub = document.createElement("div");
      sub.className = "summary-row-sub";
      if (entry.isMultiWeight) {
        sub.textContent = tierLabels.map((t, i) => {
          const w = entry.weights[i];
          const reps = (entry.setsByTier[i] || []).map(v => (v === null || v === undefined ? "—" : v)).join("/");
          return `${t} ${w === null || w === undefined ? "—" : w + "kg"} (${reps})`;
        }).join("　");
      } else {
        sub.textContent = `${entry.weight || "—"}　${entry.sets.map(v => (v === null || v === undefined ? "—" : v)).join(" / ")}`;
      }
      left.appendChild(sub);
      row.appendChild(left);

      const editRowBtn = document.createElement("button");
      editRowBtn.type = "button";
      editRowBtn.className = "summary-edit-btn";
      editRowBtn.textContent = "編集";
      editRowBtn.addEventListener("click", () => {
        if (state.queue.includes(entry.exercise)) {
          state.step = "exercise";
          state.index = state.queue.indexOf(entry.exercise);
        } else {
          state.step = "manual";
        }
        render();
      });
      row.appendChild(editRowBtn);
      summaryList.appendChild(row);
    });
    card.appendChild(summaryList);

    const addMoreBtn = document.createElement("button");
    addMoreBtn.type = "button";
    addMoreBtn.className = "ghost-btn";
    addMoreBtn.textContent = "＋ 他の種目を追加";
    addMoreBtn.style.margin = "6px 0 14px";
    addMoreBtn.addEventListener("click", () => {
      const name = window.prompt("追加する種目名を入力してください");
      if (name && name.trim()) {
        const trimmed = name.trim();
        state.entries.push({ exercise: trimmed, weight: "", sets: [null, null, null] });
        if (!state.queue.includes(trimmed)) state.queue.push(trimmed);
        state.index = state.queue.indexOf(trimmed);
        state.step = "exercise";
        render();
      }
    });
    card.appendChild(addMoreBtn);

    const feedbackCard = document.createElement("div");
    feedbackCard.className = "feedback-input-card";
    const feedbackField = document.createElement("div");
    feedbackField.className = "field";
    feedbackField.innerHTML = '<label for="fFeedback">この日のフィードバック</label>';
    const feedbackInput = document.createElement("textarea");
    feedbackInput.id = "fFeedback";
    feedbackField.appendChild(feedbackInput);
    feedbackCard.appendChild(feedbackField);
    card.appendChild(feedbackCard);

    const actions = document.createElement("div");
    actions.className = "modal-actions";
    const cancelBtn = document.createElement("button");
    cancelBtn.type = "button";
    cancelBtn.className = "ghost-btn";
    cancelBtn.textContent = "キャンセル";
    cancelBtn.addEventListener("click", closeForm);
    actions.appendChild(cancelBtn);

    const rightActions = document.createElement("div");
    rightActions.className = "modal-actions-right";
    const saveBtn = document.createElement("button");
    saveBtn.type = "button";
    saveBtn.className = "primary-btn";
    saveBtn.textContent = "保存する";
    saveBtn.addEventListener("click", async () => {
      errorEl.classList.add("hidden");
      const dk = dateInput.value;
      if (!dk) { showErr("日付を入力してください。"); return; }
      if (state.entries.length === 0) { showErr("種目を1つ以上記録してください。"); return; }

      const expandedEntries = [];
      state.entries.forEach(e => {
        if (e.isMultiWeight) {
          tierLabels.forEach((t, i) => {
            const w = e.weights[i];
            const sets = e.setsByTier[i] || [null, null, null];
            const hasAny = (w !== null && w !== undefined) || sets.some(v => v !== null && v !== undefined);
            if (!hasAny) return;
            expandedEntries.push({
              exercise: `${e.exercise}（${t}）`,
              weight: w !== null && w !== undefined ? `${w}kg` : "",
              sets: [sets[0] ?? null, sets[1] ?? null, sets[2] ?? null],
              memo: ""
            });
          });
        } else {
          expandedEntries.push({
            exercise: e.exercise,
            weight: e.weight || "",
            sets: [e.sets[0] ?? null, e.sets[1] ?? null, e.sets[2] ?? null],
            memo: ""
          });
        }
      });

      const [y, m, d] = dk.split("-").map(Number);
      const data = {
        weekday: weekdayOf(y, m, d),
        part: state.part,
        entries: expandedEntries,
        feedback: feedbackInput.value.trim()
      };

      saveBtn.disabled = true;
      saveBtn.textContent = "保存中…";
      try {
        await db.doc("workouts/" + dk).set(data);
        selectedDate = dk;
        const newDate = new Date(y, m - 1, d);
        activeYear = newDate.getFullYear();
        activeMonth = newDate.getMonth() + 1;
        closeForm();
      } catch (e) {
        saveBtn.disabled = false;
        saveBtn.textContent = "保存する";
        showErr("保存に失敗しました。もう一度お試しください。");
      }
    });
    rightActions.appendChild(saveBtn);
    actions.appendChild(rightActions);
    card.appendChild(actions);

    function showErr(msg) {
      errorEl.textContent = msg;
      errorEl.classList.remove("hidden");
    }
  }
}

function renderEditCard(card, dateKey, existing) {
  const title = document.createElement("div");
  title.className = "modal-title";
  title.textContent = "記録を編集";
  card.appendChild(title);

  const errorEl = document.createElement("div");
  errorEl.className = "form-error hidden";
  card.appendChild(errorEl);

  const dateField = document.createElement("div");
  dateField.className = "field";
  dateField.innerHTML = '<label for="fDate">日付</label>';
  const dateInput = document.createElement("input");
  dateInput.type = "date";
  dateInput.id = "fDate";
  dateInput.value = dateKey;
  dateInput.disabled = true;
  dateField.appendChild(dateInput);
  card.appendChild(dateField);

  const partField = document.createElement("div");
  partField.className = "field";
  partField.innerHTML = '<label for="fPart">部位</label>';
  const partSelect = document.createElement("select");
  partSelect.id = "fPart";
  partNames.forEach(p => {
    const opt = document.createElement("option");
    opt.value = p; opt.textContent = p;
    if (existing.part === p) opt.selected = true;
    partSelect.appendChild(opt);
  });
  partField.appendChild(partSelect);
  card.appendChild(partField);

  const exercisesLabel = document.createElement("div");
  exercisesLabel.className = "field";
  exercisesLabel.innerHTML = '<label>種目</label>';
  card.appendChild(exercisesLabel);

  const rowsWrap = document.createElement("div");
  card.appendChild(rowsWrap);

  if (existing.entries && existing.entries.length) {
    existing.entries.forEach(en => makeExerciseRow(rowsWrap, en));
  } else {
    makeExerciseRow(rowsWrap, null);
  }

  const addRowBtn = document.createElement("button");
  addRowBtn.type = "button";
  addRowBtn.className = "ghost-btn";
  addRowBtn.textContent = "＋ 種目を追加";
  addRowBtn.style.marginBottom = "14px";
  addRowBtn.addEventListener("click", () => makeExerciseRow(rowsWrap, null));
  card.appendChild(addRowBtn);

  const feedbackCard = document.createElement("div");
  feedbackCard.className = "feedback-input-card";
  const feedbackField = document.createElement("div");
  feedbackField.className = "field";
  feedbackField.innerHTML = '<label for="fFeedback">この日のフィードバック</label>';
  const feedbackInput = document.createElement("textarea");
  feedbackInput.id = "fFeedback";
  feedbackInput.value = existing.feedback || "";
  feedbackField.appendChild(feedbackInput);
  feedbackCard.appendChild(feedbackField);
  card.appendChild(feedbackCard);

  const actions = document.createElement("div");
  actions.className = "modal-actions";
  const cancelBtn = document.createElement("button");
  cancelBtn.type = "button";
  cancelBtn.className = "ghost-btn";
  cancelBtn.textContent = "キャンセル";
  cancelBtn.addEventListener("click", closeForm);
  actions.appendChild(cancelBtn);

  const rightActions = document.createElement("div");
  rightActions.className = "modal-actions-right";
  const saveBtn = document.createElement("button");
  saveBtn.type = "button";
  saveBtn.className = "primary-btn";
  saveBtn.textContent = "保存する";
  rightActions.appendChild(saveBtn);
  actions.appendChild(rightActions);
  card.appendChild(actions);

  saveBtn.addEventListener("click", async () => {
    errorEl.classList.add("hidden");
    const dk = dateInput.value;
    if (!dk) { showError("日付を入力してください。"); return; }
    const rows = Array.from(rowsWrap.children).map(r => r._get());
    const validRows = rows.filter(r => r.exercise !== "");
    if (validRows.length === 0) { showError("種目を1つ以上入力してください。"); return; }

    const entries = validRows.map(r => ({
      exercise: r.exercise,
      weight: r.weight ? `${r.weight}kg` : "",
      sets: [r.sets[0] ?? null, r.sets[1] ?? null, r.sets[2] ?? null],
      memo: ""
    }));

    const [y, m, d] = dk.split("-").map(Number);
    const data = {
      weekday: weekdayOf(y, m, d),
      part: partSelect.value,
      entries,
      feedback: feedbackInput.value.trim()
    };

    saveBtn.disabled = true;
    saveBtn.textContent = "保存中…";
    try {
      await db.doc("workouts/" + dk).set(data);
      selectedDate = dk;
      const newDate = new Date(y, m - 1, d);
      activeYear = newDate.getFullYear();
      activeMonth = newDate.getMonth() + 1;
      closeForm();
    } catch (e) {
      saveBtn.disabled = false;
      saveBtn.textContent = "保存する";
      showError("保存に失敗しました。もう一度お試しください。");
    }
  });

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.remove("hidden");
  }
}

renderCalendar();
initDb();
window.addEventListener("resize", () => {
  const rec = selectedDate ? records[selectedDate] : null;
  if (rec) renderChart(rec);
});
</script>
