<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Being</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", "Yu Gothic", "Meiryo", sans-serif;
    background: #f9f9f7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) body { background: #0d0d0d; }
  }
  :root[data-theme="dark"] body { background: #0d0d0d; }

  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --accent:         #7c3aed;
    --accent-contrast:#ffffff;
    --surface-2:      #f2f0ea;
    --cell-off:       #e7e5de;
    --cell-on:        #7c3aed;
    max-width: 780px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 32px 16px 48px;
    display: flex;
    flex-direction: column;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --border:         rgba(255,255,255,0.10);
      --accent:         #9d75f0;
      --accent-contrast:#141413;
      --surface-2:      #232321;
      --cell-off:       #2c2c2a;
      --cell-on:        #9d75f0;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --border:         rgba(255,255,255,0.10);
    --accent:         #9d75f0;
    --accent-contrast:#141413;
    --surface-2:      #232321;
    --cell-off:       #2c2c2a;
    --cell-on:        #9d75f0;
  }

  h1 {
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
    color: var(--text-primary);
    margin: 0 0 16px;
    letter-spacing: 0.02em;
    text-align: center;
  }

  .proto-note {
    font-size: 11.5px;
    color: var(--text-muted);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
  }

  .tiles-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tiles-group {
    width: 100%;
  }
  .tiles {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  @media (max-width: 520px) {
    .tiles { grid-template-columns: repeat(2, 1fr); }
  }
  .tile {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 12px;
    text-align: center;
    text-decoration: none;
    display: block;
  }
  .tile-label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 8px;
  }
  .tile-status {
    width: 10px; height: 10px;
    border-radius: 50%;
    margin: 0 auto 8px;
    background: var(--cell-off);
  }
  .tile-status.done { background: var(--accent); }
  .tile-streak {
    font-size: 11px;
    color: var(--text-secondary);
  }

</style>
</head><body>

<div class="viz-root">
  <div class="proto-note">※ Lifestyle・Trainingはこの端末のブラウザに保存された記録（localStorage）を表示します。ファイルを直接開いた場合、ページごとに保存領域が分かれて共有されないことがあります。</div>

  <div class="tiles-wrap">
    <div class="tiles-group">
      <h1>BeInG</h1>
      <div class="tiles">
        <a class="tile" href="../Lifestyle/ジャーナルカレンダー.html">
          <div class="tile-label">Lifestyle</div>
          <div class="tile-status" id="lifestyle-status"></div>
          <div class="tile-streak" id="lifestyle-streak">-</div>
        </a>
        <a class="tile" href="../Training/kintore-app/index.html">
          <div class="tile-label">Training</div>
          <div class="tile-status" id="training-status"></div>
          <div class="tile-streak" id="training-streak">-</div>
        </a>
        <a class="tile" href="../Appearance/外見メモ_2026年9月.html">
          <div class="tile-label">Appearance</div>
        </a>
        <a class="tile" href="../Communication/会話力メモ_2026年9月.html">
          <div class="tile-label">Communication</div>
        </a>
      </div>
    </div>
  </div>
</div>

<script>
  function pad2(n) { return String(n).padStart(2, "0"); }
  function keyOf(date) { return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`; }

  function readRecords(storageKey) {
    try {
      const raw = localStorage.getItem(storageKey);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function computeStatus(records) {
    const today = new Date();
    const doneToday = !!records[keyOf(today)];
    let streak = 0;
    const cursor = new Date(today);
    if (!doneToday) cursor.setDate(cursor.getDate() - 1);
    while (records[keyOf(cursor)]) {
      streak += 1;
      cursor.setDate(cursor.getDate() - 1);
    }
    return { doneToday, streak };
  }

  function applyStatus(prefix, storageKey) {
    const { doneToday, streak } = computeStatus(readRecords(storageKey));
    const statusEl = document.getElementById(`${prefix}-status`);
    const streakEl = document.getElementById(`${prefix}-streak`);
    statusEl.classList.toggle("done", doneToday);
    streakEl.textContent = streak > 0 ? `🔥 ${streak}日` : "記録なし";
  }

  applyStatus("lifestyle", "lifestyle_records_v1");
  applyStatus("training", "kintore_records_v1");
</script>

</body></html>
